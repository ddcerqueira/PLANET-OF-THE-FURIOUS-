<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#060d24">
  <meta name="description" content="Junte carros iguais, acelere na pista noturna e domine o PLANET OF THE FURIOUS.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PLANET OF THE FURIOUS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ============================ SPLASH ============================ -->
  <section id="splash" class="screen wall">
    <div class="splash-glow"></div>
    <div class="tag" id="splashTag">
      <svg class="splatter" aria-hidden="true"></svg>
      <h1 class="graffiti">
        <span class="g-top">PLANET OF THE</span>
        <span class="g-main">FURIOUS</span>
      </h1>
      <svg class="drips" aria-hidden="true"></svg>
    </div>
    <div class="splash-car"><img id="splashCar" alt=""></div>
    <button id="btnStart" class="btn btn-orange btn-xl">ACELERAR</button>
    <p class="splash-hint">Junte carros iguais · Corra na pista · Fature moedas</p>
    <p class="splash-legal">Jogo de fã não oficial. Carros desenhados por código.</p>
  </section>

  <!-- ============================ JOGO ============================== -->
  <main id="game" class="screen hidden">
    <header class="topbar wall">
      <div class="tag tag-mini" id="miniTag">
        <svg class="splatter" aria-hidden="true"></svg>
        <div class="graffiti"><span class="g-top">PLANET OF THE</span> <span class="g-main">FURIOUS</span></div>
        <svg class="drips" aria-hidden="true"></svg>
      </div>
      <button id="btnMute" class="icon-btn" aria-label="Som"></button>
      <button id="btnSettings" class="icon-btn" aria-label="Configurações">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </header>

    <div class="hud">
      <div class="hud-coins">
        <span class="coin-ico"></span>
        <span id="coins">0</span>
      </div>
      <div class="hud-stat"><small>RENDA</small><b id="income">0/s</b></div>
      <div class="hud-stat hud-max"><small>NÍVEL MÁX</small><b id="maxLevel"></b></div>
    </div>

    <div class="track-wrap" id="trackWrap" data-drop="track">
      <canvas id="track"></canvas>
      <div id="nitroBanner" class="nitro-banner hidden">NITRO x2 <span id="nitroTime">30</span>s</div>
      <div class="track-side">
        <button id="btnNitro" class="round-btn nitro" aria-label="Nitro">
          <svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"/></svg>
          <svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
          <span class="rb-label" id="nitroLabel">NITRO</span>
        </button>
        <button id="btnChest" class="round-btn chest" aria-label="Baú diário">
          <svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v1H4zm0 3h7v2h2v-2h7v8H4z"/></svg>
          <span class="rb-label" id="chestLabel">BAÚ</span>
        </button>
      </div>
      <div class="track-hint" id="trackHint">Arraste um carro para a pista!</div>
    </div>

    <div class="pit" id="pit" data-drop="track"></div>

    <div class="garage" id="garage"></div>

    <nav class="actions">
      <div class="act trash" id="trash" data-drop="trash">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7z"/></svg>
        <span>VENDER</span>
      </div>
      <button id="btnBuy" class="btn btn-orange buy">
        <img id="buyCar" alt="">
        <span class="buy-txt"><b>COMPRAR</b><span class="buy-price"><span class="coin-ico sm"></span><span id="buyPrice">0</span></span></span>
      </button>
      <button id="btnUpgrades" class="act" aria-label="Upgrades">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 4 11h5v10h6V11h5z"/></svg>
        <span>UPGRADES</span><i class="dot hidden" id="upgDot"></i>
      </button>
      <button id="btnCollection" class="act" aria-label="Coleção">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg>
        <span>COLEÇÃO</span>
      </button>
    </nav>
  </main>

  <!-- Camada de efeitos (partículas, carro sendo arrastado) -->
  <div id="fx"></div>

  <!-- Popups -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="cars.js"></script>
<script src="game.js"></script>
</body>
</html>
