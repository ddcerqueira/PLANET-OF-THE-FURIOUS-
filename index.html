<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060d24">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Junte carros iguais, acelere na pista noturna e domine o PLANET OF THE FURIOUS.">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Furious">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PLANET OF THE FURIOUS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ícones (SVG sprite) — usados com <svg><use href="#i-nome"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7zm4 2v8h1.6v-8zm2.4 0v8H14v-8z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 2 4 14h6.5L9.5 22 20 9.5h-6.6z"/></symbol>
  <symbol id="i-chest" viewBox="0 0 24 24"><path fill="currentColor" d="M5 4h14a3 3 0 0 1 3 3v3H2V7a3 3 0 0 1 3-3zm-3 8h8v2.5h4V12h8v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-upgrade" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4.5 10H9v4h6v-4h4.5zM6 16h12v2.5H6zm0 3.5h12V22H6z"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path fill="currentColor" d="M5 2h2v20H5zm3 1h12l-2.5 4.5L20 12H8zm2 2v2h2V5zm4 0v2h2V5zm-2 2v2h2V7zm4 0v2h2V7zm-6 2v2h2V9zm4 0v2h2V9z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0zm3 4a1.5 1.5 0 0 0-1 2.6V19h2v-2.4a1.5 1.5 0 0 0-1-2.6z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="currentColor" d="m6.4 4.9 5.6 5.7 5.6-5.7 1.5 1.5-5.7 5.6 5.7 5.6-1.5 1.5-5.6-5.7-5.6 5.7-1.5-1.5 5.7-5.6-5.7-5.6z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3zm13 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5zm-2-8v2a6 6 0 0 1 0 12v2a8 8 0 0 0 0-16z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path fill="currentColor" d="M9 3h12v13.5a3.5 3.5 0 1 1-2-3.2V8h-8v10.5a3.5 3.5 0 1 1-2-3.2z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="currentColor" d="m9.5 16.6-4.8-4.8-1.6 1.6 6.4 6.4L21 8.3l-1.6-1.6z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="m12 2 2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.4 5.8 21.1l1.6-7L2 9.3l7.1-.7z"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><path fill="currentColor" d="M20 7h-2.2A3 3 0 0 0 12 4.1 3 3 0 0 0 6.2 7H4a1 1 0 0 0-1 1v3h8V7.5h2V11h8V8a1 1 0 0 0-1-1zM9 7a1 1 0 1 1 1-1v1zm5 0V6a1 1 0 1 1 1 1zM4 13h7v8H5a1 1 0 0 1-1-1zm9 0h7v7a1 1 0 0 1-1 1h-6z"/></symbol>
  <symbol id="i-road" viewBox="0 0 24 24"><path fill="currentColor" d="M9 2h2l-.5 4h3L13 2h2l4 20h-6l-.4-4h-1.2L11 22H5zm1.6 8-.3 3h3.4l-.3-3z"/></symbol>
  <symbol id="i-garage" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 2 8v14h4V12h12v10h4V8zM8 14h8v2H8zm0 3.5h8v2H8z"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path fill="currentColor" d="M9 2.5a1.5 1.5 0 0 1 3 0V10l.8-.1a1.5 1.5 0 0 1 2.7.8l.6-.1a1.5 1.5 0 0 1 2.4 1l.4-.1A1.6 1.6 0 0 1 21 13v4.5c0 2.5-2 4.5-4.5 4.5h-3.3a4.5 4.5 0 0 1-3.6-1.8L5 14.3a1.5 1.5 0 0 1 2.3-1.9L9 14z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4 4 13h5v7h6v-7h5z"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4 2 9l5 5v-3.5h8v-3H7zm10 6v3.5H9v3h8V20l5-5z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path fill="currentColor" d="M8 2h11a2 2 0 0 1 2 2v12h-2V4H8zM4 6h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.4 5H22l-3.5 4.5L15 9h2.2A6 6 0 1 0 18 14.4l1.9.7A8 8 0 1 1 12 4z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 7.5 6.5l1.4 1.4L11 5.8V15h2V5.8l2.1 2.1 1.4-1.4zM5 10h3v2H6v8h12v-8h-2v-2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="currentColor" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h12v2h3v3a4 4 0 0 1-4 4h-.4A5 5 0 0 1 13 14v3h3v3H8v-3h3v-3a5 5 0 0 1-3.6-3H7a4 4 0 0 1-4-4V4h3zm-1 4v1a2 2 0 0 0 1.5 1.9A6 6 0 0 1 6 6zm13 0v0a6 6 0 0 1-.5 2.9A2 2 0 0 0 19 7V6z"/></symbol>
</svg>

<div id="app">

  <!-- ============================ SPLASH ============================ -->
  <section id="splash" class="screen wall" aria-label="Tela inicial">
    <div class="splash-glow"></div>
    <div class="tag" id="splashTag">
      <svg class="splatter" aria-hidden="true"></svg>
      <h1 class="graffiti">
        <span class="g-top">PLANET OF THE</span>
        <span class="g-main">FURIOUS</span>
      </h1>
      <svg class="drips" aria-hidden="true"></svg>
    </div>
    <div class="splash-car"><img id="splashCar" alt=""></div>
    <button id="btnStart" class="btn btn-orange btn-xl" disabled>
      <span id="startLabel">CARREGANDO…</span>
    </button>
    <p class="splash-hint" id="splashHint">Junte carros iguais · Corra na pista · Fature moedas</p>
    <p class="splash-legal">Jogo de fã não oficial. Carros desenhados por código.</p>
  </section>

  <!-- ============================ JOGO ============================== -->
  <main id="game" class="screen" hidden>
    <header class="brand wall" id="brand">
      <div class="tag tag-mini" id="miniTag">
        <svg class="splatter" aria-hidden="true"></svg>
        <div class="graffiti"><span class="g-top">PLANET OF THE</span> <span class="g-main">FURIOUS</span></div>
        <svg class="drips" aria-hidden="true"></svg>
      </div>
    </header>

    <div class="hud">
      <div class="hud-money" id="hudMoney">
        <span class="coin-ico" id="coinIco"></span>
        <div class="hud-money-txt">
          <b id="coins">0</b>
          <small><span id="income">0/s</span><span class="x2-tag" id="x2Tag" hidden>NITRO x2</span></small>
        </div>
      </div>
      <button class="hud-level" id="hudLevel" aria-label="Seu melhor carro — abrir coleção">
        <span id="hudChap"></span>
        <span class="hud-level-txt"><small>MELHOR</small><b id="maxLevel">Lv 1</b></span>
      </button>
      <button id="btnSettings" class="icon-btn" aria-label="Configurações"><svg><use href="#i-gear"/></svg></button>
    </div>

    <section class="track-wrap" id="trackWrap" aria-label="Pista">
      <canvas id="track"></canvas>
      <div class="track-count" id="trackCount"><svg><use href="#i-road"/></svg><span>0/3</span></div>
      <div id="nitroBanner" class="nitro-banner" hidden><svg><use href="#i-bolt"/></svg> NITRO x2 <b id="nitroTime">30</b>s</div>
      <div class="track-hint" id="trackHint">Arraste um carro para a pista</div>
      <div class="drop-label" aria-hidden="true">SOLTE NA PISTA</div>
    </section>

    <div class="pit" id="pit" aria-label="Vagas da pista"></div>

    <section class="garage-wrap" id="garageWrap" aria-label="Garagem">
      <div class="garage" id="garage"></div>
      <button class="reserve-pill" id="reservePill" hidden><svg><use href="#i-gift"/></svg><span></span></button>
    </section>

    <div class="actions" id="actions">
      <button class="act-trash" id="trash" aria-label="Vender (arraste um carro até aqui)">
        <svg><use href="#i-trash"/></svg><span>VENDER</span>
      </button>
      <button id="btnBuy" class="buy" aria-label="Comprar carro">
        <span class="buy-fill" id="buyFill"></span>
        <img id="buyCar" alt="">
        <span class="buy-txt">
          <b id="buyTitle">COMPRAR</b>
          <span class="buy-price"><span class="coin-ico sm"></span><span id="buyPrice">0</span></span>
        </span>
        <span class="buy-lv" id="buyLv">Lv 1</span>
      </button>
      <button id="btnNitro" class="nitro-btn" aria-label="Nitro">
        <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring-bg" cx="32" cy="32" r="29"/><circle class="ring-fg" cx="32" cy="32" r="29"/></svg>
        <svg class="ico"><use href="#i-bolt"/></svg>
        <span class="nitro-label" id="nitroLabel">NITRO</span>
      </button>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Menu">
      <button data-nav="upgrades"><span class="tab-ico"><svg><use href="#i-upgrade"/></svg><i class="badge" hidden></i></span><span>Upgrades</span></button>
      <button data-nav="missions"><span class="tab-ico"><svg><use href="#i-flag"/></svg><i class="badge" hidden></i></span><span>Missões</span></button>
      <button data-nav="chest"><span class="tab-ico"><svg><use href="#i-chest"/></svg><i class="badge" hidden></i></span><span id="chestLabel">Baú</span></button>
      <button data-nav="collection"><span class="tab-ico"><svg><use href="#i-grid"/></svg></span><span id="colLabel">Coleção</span></button>
    </nav>
  </main>

  <!-- Painel inferior (upgrades, missões, coleção, ajustes) -->
  <div id="sheetLayer" class="sheet-layer" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head" id="sheetHead">
        <i class="sheet-handle" aria-hidden="true"></i>
        <h2 id="sheetTitle"></h2>
        <button class="close-btn" id="sheetClose" aria-label="Fechar"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- Popups de recompensa / confirmação -->
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <!-- Tutorial (não bloqueia o jogo) -->
  <div id="tut" class="tut" hidden>
    <div class="tut-ring" id="tutRing"></div>
    <div class="tut-hand" id="tutHand"><svg><use href="#i-hand"/></svg></div>
    <div class="tut-card" id="tutCard">
      <div class="tut-step" id="tutStep"></div>
      <p id="tutText"></p>
      <div class="tut-actions"><button id="tutSkip" class="tut-skip">Pular tutorial</button><button id="tutNext" class="tut-next" hidden>Continuar</button></div>
    </div>
  </div>

  <div id="fx" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="banner" class="banner" hidden></div>
</div>

<script src="cars.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="meta.js"></script>
</body>
</html>
